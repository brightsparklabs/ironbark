name: Publish Docker Images

on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  build-oci-image:
    name: Build OCI Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI images
        run: make oci-image

      - name: Upload K3s image artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: ironbark-k3s-image
          path: build/images/oci-brightsparklabs-ironbark-*.tar
          retention-days: 7

      - name: Upload RKE2 image artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: ironbark-rke2-image
          path: build/images/oci-brightsparklabs-ironbark-rke2-*.tar
          retention-days: 7

  publish-oci-image:
    name: Publish to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_PUBLIC }}
          password: ${{ secrets.DOCKER_PASSWORD_PUBLIC }}

      - name: Build and push K3s image
        run: |
          APP_VERSION=$(git describe --always --dirty 2>/dev/null || echo dev)
          docker buildx build \
            --target ironbark-k3s \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg BUILD_TIME_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg VCS_REF=$(git rev-parse HEAD) \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t brightsparklabs/ironbark:${APP_VERSION} \
            -t brightsparklabs/ironbark:latest .

      - name: Build and push RKE2 image
        run: |
          APP_VERSION=$(git describe --always --dirty 2>/dev/null || echo dev)
          docker buildx build \
            --target ironbark-rke2 \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg BUILD_TIME_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg VCS_REF=$(git rev-parse HEAD) \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t brightsparklabs/ironbark-rke2:${APP_VERSION} \
            -t brightsparklabs/ironbark-rke2:latest .
