name: Publish Docker Images

on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  build-oci-image:
    name: Build OCI Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI images
        run: make oci-image-save

      - name: Upload K3s image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironbark-k3s-image
          path: build/images/oci-brightsparklabs-ironbark-*.tar
          retention-days: 7

      - name: Upload RKE2 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironbark-rke2-image
          path: build/images/oci-brightsparklabs-ironbark-rke2-*.tar
          retention-days: 7

  publish-oci-image:
    name: Publish to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_PUBLIC }}
          password: ${{ secrets.DOCKER_PASSWORD_PUBLIC }}

      - name: Build and push multi-arch images
        run: make oci-image-push
